<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Thư viện video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1a2233;--mute:#6b7488;--line:#d9dee7;--acc:#2b4cff;--danger:#d23b3b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;white-space:nowrap}
#q{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:var(--danger)}
main{padding:14px;max-width:1280px;margin:0 auto}
#grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(min-width:640px){#grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.thumb{aspect-ratio:16/9;background:#fff;border-bottom:1px solid var(--line);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;bottom:8px;background:var(--ink);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.meta{padding:10px 12px 12px}
.meta h3{margin:0;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta p{margin:4px 0 0;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.95);font-size:15px}
.empty{text-align:center;color:var(--mute);padding:70px 20px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(15,20,32,.6);display:none;z-index:20;align-items:center;justify-content:center;padding:14px}
.overlay.on{display:flex}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:18px}
.sheet h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
.sheet input[type=text],.sheet input[type=url],.sheet select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px}
.chk input{width:18px;height:18px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row .grow{flex:1}
#st{font-size:12px;color:var(--mute);margin-top:6px;min-height:16px}
#pv{max-width:960px;padding:0;background:#000;overflow:hidden}
#stage{aspect-ratio:16/9;background:#000}
#stage video,#stage iframe{width:100%;height:100%;border:0;display:block}
#pbar{background:#fff;padding:12px 14px}
#pbar h2{font-size:15px;margin:0 0 10px;word-break:break-word}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;display:none;z-index:40}
</style>
</head>
<body>

<header>
  <h1>Video</h1>
  <input id="q" type="search" placeholder="Tìm theo tiêu đề hoặc link">
  <button class="btn" id="bk">Sao lưu</button>
  <button class="btn" id="rs">Khôi phục</button>
  <input type="file" id="rf" accept="application/json" hidden>
  <button class="btn pri" id="add">Thêm</button>
</header>
<main><div id="grid"></div></main>

<div class="overlay" id="edit">
  <form class="sheet" id="ef">
    <h2 id="et">Thêm video</h2>
    <label for="f-url">Link video</label>
    <input id="f-url" type="url" placeholder="https://..." required>
    <div id="st"></div>
    <label for="f-title">Tiêu đề</label>
    <input id="f-title" type="text">
    <label for="f-thumb">Link ảnh thumbnail (để trống = nền trắng)</label>
    <input id="f-thumb" type="url">
    <label for="f-fb">Nếu không tìm được ảnh</label>
    <select id="f-fb">
      <option value="shot">Dùng ảnh chụp trang</option>
      <option value="icon">Dùng logo trang</option>
      <option value="none">Để nền trắng</option>
    </select>
    <label for="f-mode">Cách mở</label>
    <select id="f-mode">
      <option value="auto">Tự động</option>
      <option value="embed">Nhúng trang (iframe)</option>
      <option value="hls">Phát trực tiếp: m3u8 (không có đuôi file)</option>
      <option value="video">Phát trực tiếp: mp4 (không có đuôi file)</option>
      <option value="link">Chỉ mở link sang trang gốc</option>
    </select>
    <label class="chk"><input type="checkbox" id="f-noref"> Không gửi referrer khi nhúng (thử nếu khung bị đen/trắng)</label>
    <div class="row"><button type="button" class="btn" id="refetch">Lấy lại tiêu đề và ảnh</button></div>
    <div class="row">
      <button class="btn pri grow">Lưu</button>
      <button type="button" class="btn" id="cancel">Hủy</button>
      <button type="button" class="btn del" id="del">Xóa</button>
    </div>
  </form>
</div>

<div class="overlay" id="player">
  <div class="sheet" id="pv">
    <div id="stage"></div>
    <div id="pbar">
      <h2 id="pt"></h2>
      <div class="row" style="margin-top:0">
        <a class="btn" id="po" target="_blank" rel="noopener" style="text-decoration:none">Mở trang gốc</a>
        <button class="btn" id="pc">Sao chép link</button>
        <button class="btn" id="pe">Sửa</button>
        <button class="btn" id="px">Đóng</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let videos = [];
let editId = null;
let curV = null;

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
const save = () => localStorage.setItem('vc', JSON.stringify(videos));

function load() {
  try { videos = JSON.parse(localStorage.getItem('vc') || '[]'); } catch { videos = []; }
  render();
  const v = videos.find(x => x.id === new URLSearchParams(location.search).get('v'));
  if (v) openVideo(v);
}

/* ---------- nhận diện link ---------- */
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const fileName = u => { try { return decodeURIComponent(new URL(u).pathname.split('/').pop() || '').replace(/\.[a-z0-9]+$/i, ''); } catch { return ''; } };
function ytId(u) {
  const m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/.exec(u);
  return m ? m[1] : '';
}
const DOOD = /(dood|d0o0d|d000d|ds2play|ds2video|dooood|vide0|do7go|playmogo)/i;

function resolve(v) {
  const u = v.url, mode = v.mode || 'auto';
  if (mode === 'link') return { kind: 'link' };
  if (mode === 'hls') return { kind: 'hls', src: u };
  if (mode === 'video') return { kind: 'video', src: u };
  if (mode === 'auto') {
    if (/\.m3u8/i.test(u)) return { kind: 'hls', src: u };
    if (/\.(mp4|webm|ogg|mov|m4v|mkv)(\?|#|$)/i.test(u)) return { kind: 'video', src: u };
  }
  const y = ytId(u);
  if (y) return { kind: 'iframe', src: `https://www.youtube.com/embed/${y}?autoplay=1` };
  const vm = /vimeo\.com\/(\d+)/.exec(u);
  if (vm) return { kind: 'iframe', src: `https://player.vimeo.com/video/${vm[1]}?autoplay=1` };
  if (DOOD.test(hostOf(u))) return { kind: 'iframe', src: u.replace(/\/d\/([A-Za-z0-9]+)/, '/e/$1') };
  return { kind: 'iframe', src: u };
}

/* ---------- lấy tiêu đề + ảnh ---------- */
async function getMeta(url) {
  const out = { title: '', thumb: '', src: '' };
  const enc = encodeURIComponent(url);
  const tm = ms => AbortSignal.timeout(ms);
  const [a, b] = await Promise.allSettled([
    fetch('https://noembed.com/embed?url=' + enc, { signal: tm(7000) }).then(r => r.json()),
    fetch('https://api.microlink.io/?url=' + enc, { signal: tm(14000) }).then(r => r.json()),
  ]);
  if (a.status === 'fulfilled' && !a.value.error) {
    out.title = a.value.title || '';
    if (a.value.thumbnail_url) { out.thumb = a.value.thumbnail_url; out.src = 'oEmbed'; }
  }
  if (b.status === 'fulfilled' && b.value.status === 'success') {
    const d = b.value.data || {};
    out.title = out.title || d.title || '';
    if (!out.thumb && d.image?.url) { out.thumb = d.image.url; out.src = 'Microlink'; }
  }
  if (!out.title || !out.thumb) {
    try {
      const r = await fetch('https://api.allorigins.win/raw?url=' + enc, { signal: tm(9000) });
      const doc = new DOMParser().parseFromString((await r.text()).slice(0, 400000), 'text/html');
      const m = n => doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)?.content?.trim() || '';
      out.title = out.title || m('og:title') || m('twitter:title') || doc.title || '';
      const i = m('og:image') || m('twitter:image');
      if (!out.thumb && i) { try { out.thumb = new URL(i, url).href; out.src = 'og:image'; } catch {} }
    } catch {}
  }
  if (/^(just a moment|attention required|access denied|checking your browser)/i.test(out.title)) out.title = '';
  return out;
}

/* ---------- hiển thị ---------- */
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = videos.filter(v => !q || ((v.title || '') + ' ' + v.url).toLowerCase().includes(q));
  const g = $('#grid');
  if (!list.length) {
    g.innerHTML = `<div class="empty">${videos.length ? 'Không có video khớp từ khóa.' : 'Chưa có video nào. Bấm “Thêm” để dán link đầu tiên.'}</div>`;
    return;
  }
  g.innerHTML = list.map(v => `<article class="card" data-id="${esc(v.id)}">
      <div class="thumb">${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${v.mode === 'link' ? '<span class="tag">Mở link</span>' : ''}</div>
      <div class="meta"><h3>${esc(v.title || hostOf(v.url))}</h3><p>${esc(hostOf(v.url))}</p></div>
      <button class="edit" data-edit="${esc(v.id)}" aria-label="Sửa">✎</button>
    </article>`).join('');
}
$('#grid').addEventListener('click', e => {
  const eb = e.target.closest('[data-edit]');
  if (eb) { e.stopPropagation(); return openEdit(videos.find(v => v.id === eb.dataset.edit)); }
  const c = e.target.closest('.card');
  if (c) openVideo(videos.find(v => v.id === c.dataset.id));
});
$('#q').addEventListener('input', render);

/* ---------- player ---------- */
function loadHls() {
  if (window.Hls) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
    s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
}
async function openVideo(v) {
  if (!v) return;
  const r = resolve(v);
  if (r.kind === 'link') { window.open(v.url, '_blank', 'noopener'); return; }
  curV = v;
  $('#pt').textContent = v.title || hostOf(v.url);
  $('#po').href = v.url;
  const st = $('#stage'); st.innerHTML = '';
  $('#player').classList.add('on');
  history.replaceState(null, '', '?v=' + encodeURIComponent(v.id));
  if (r.kind === 'iframe') {
    const f = document.createElement('iframe');
    if (v.noref) f.referrerPolicy = 'no-referrer';
    f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    f.allowFullscreen = true;
    f.src = r.src;
    st.appendChild(f);
  } else {
    const vd = document.createElement('video');
    vd.controls = true; vd.autoplay = true; vd.playsInline = true;
    vd.onerror = () => toast('Không phát được. Thử “Mở trang gốc”.');
    st.appendChild(vd);
    if (r.kind === 'hls' && !vd.canPlayType('application/vnd.apple.mpegurl')) {
      try {
        await loadHls();
        const h = new Hls();
        h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) toast('Lỗi tải luồng m3u8 (có thể bị chặn CORS hoặc hết hạn)'); });
        h.loadSource(r.src); h.attachMedia(vd);
      } catch { toast('Không tải được trình phát HLS'); }
    } else vd.src = r.src;
  }
}
function closePlayer() {
  $('#stage').innerHTML = '';
  $('#player').classList.remove('on');
  history.replaceState(null, '', location.pathname);
}
$('#px').onclick = closePlayer;
$('#pc').onclick = async () => {
  const link = location.origin + location.pathname + '?v=' + encodeURIComponent(curV.id);
  try { await navigator.clipboard.writeText(link); toast('Đã sao chép link'); } catch { prompt('Link:', link); }
};
$('#pe').onclick = () => { const v = curV; closePlayer(); openEdit(v); };
$('#player').addEventListener('click', e => { if (e.target.id === 'player') closePlayer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePlayer(); $('#edit').classList.remove('on'); } });

/* ---------- thêm / sửa ---------- */
function openEdit(v) {
  editId = v ? v.id : null;
  $('#et').textContent = v ? 'Sửa video' : 'Thêm video';
  $('#f-url').value = v?.url || '';
  $('#f-title').value = v?.title || '';
  $('#f-thumb').value = v?.thumb || '';
  $('#f-mode').value = v?.mode || 'auto';
  $('#f-noref').checked = !!v?.noref;
  $('#f-fb').value = localStorage.getItem('fb') || 'shot';
  $('#del').style.display = v ? '' : 'none';
  $('#st').textContent = '';
  $('#edit').classList.add('on');
  if (!v) $('#f-url').focus();
}

async function autoFill(force) {
  const url = $('#f-url').value.trim();
  if (!/^https?:\/\//i.test(url)) return;
  const fb = $('#f-fb').value;
  localStorage.setItem('fb', fb);
  $('#st').textContent = 'Đang lấy tiêu đề và ảnh (có thể mất vài giây)…';
  let m = { title: '', thumb: '', src: '' };
  try { m = await getMeta(url); } catch {}
  const y = ytId(url);
  if (!m.thumb && y) { m.thumb = `https://img.youtube.com/vi/${y}/hqdefault.jpg`; m.src = 'YouTube'; }
  if (!m.thumb && fb === 'shot') { m.thumb = 'https://s.wordpress.com/mshots/v1/' + encodeURIComponent(url) + '?w=640'; m.src = 'ảnh chụp trang'; }
  if (!m.thumb && fb === 'icon') { m.thumb = 'https://www.google.com/s2/favicons?domain=' + hostOf(url) + '&sz=128'; m.src = 'logo trang'; }
  if (force || !$('#f-title').value) $('#f-title').value = m.title || fileName(url) || hostOf(url);
  if (force || !$('#f-thumb').value) $('#f-thumb').value = m.thumb || '';
  $('#st').textContent = m.thumb ? `Ảnh lấy từ: ${m.src}.` + (m.src === 'ảnh chụp trang' ? ' (lần đầu ảnh có thể hiện chậm)' : '') : 'Không tìm thấy ảnh, thumbnail để trắng.';
}
$('#f-url').addEventListener('change', () => autoFill(false));
$('#refetch').onclick = () => autoFill(true);
$('#add').onclick = () => openEdit(null);
$('#cancel').onclick = () => $('#edit').classList.remove('on');

$('#ef').addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('#f-url').value.trim();
  if (!editId && !$('#f-title').value && !$('#f-thumb').value) await autoFill(false);
  const data = {
    url,
    title: $('#f-title').value.trim() || fileName(url) || hostOf(url),
    thumb: $('#f-thumb').value.trim(),
    mode: $('#f-mode').value,
    noref: $('#f-noref').checked,
  };
  if (editId) Object.assign(videos.find(v => v.id === editId), data);
  else videos.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ...data });
  $('#edit').classList.remove('on');
  render(); save();
});

$('#del').onclick = () => {
  if (!confirm('Xóa video này khỏi thư viện?')) return;
  videos = videos.filter(v => v.id !== editId);
  $('#edit').classList.remove('on');
  render(); save();
};

/* ---------- sao lưu / khôi phục ---------- */
$('#bk').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(videos, null, 1)], { type: 'application/json' }));
  a.download = 'video-library-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('#rs').onclick = () => $('#rf').click();
$('#rf').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    const have = new Set(videos.map(v => v.id));
    const add = data.filter(v => v && v.id && v.url && !have.has(v.id));
    videos = [...add, ...videos];
    render(); save(); toast('Đã thêm ' + add.length + ' video');
  } catch { toast('File không hợp lệ'); }
  e.target.value = '';
};

load();
</script>
</body>
</html>
